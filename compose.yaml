# 航电双模块密钥轮换复核
#
# 宿主机端口可通过环境变量 HOST_PORT 配置（默认 8080）：
#   HOST_PORT=9000 docker compose up --build
#
# 一次性校验（核心状态测试 + 静态构建检查 + 页面/健康 HTTP 冒烟，以退出码结束）：
#   docker compose --profile verify run --rm verify ; echo "exit=$?"
services:
  web:
    build:
      context: .
      target: web
    image: avionics-key-rotation-web:latest
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    image: avionics-key-rotation-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:80
    restart: "no"
